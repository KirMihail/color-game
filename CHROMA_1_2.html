const releaseRender=render;render=function(){releaseRender();if(storageWarning&&page==='home'&&!document.querySelector('.storage-notice'))$('app').insertAdjacentHTML('beforeend','<div class="quiet storage-notice">Браузер не сохраняет прогресс. Скачай отчёт перед закрытием.</div>')};


// QA 1.1: isolate transient UI state and make successful steps explicit and immutable.
function clearMessage(){feedback='';tone='';let n=$('feedback');if(n){n.textContent='';n.className='feedback'}}
function advanceTask(){if(page!=='game'||busy||!S.awaitNext)return;S.awaitNext=false;S.step++;S.taskAttempts=0;S.taskHelp=false;hintStage=0;hintText='';H=[];clearMessage();if(S.step>=taskCount()){endLevel();return}newTask();render();persist();window.scrollTo(0,0)}
const qaGame=game;
game=function(){if(!S.awaitNext)return qaGame();let html=qaGame(),start=html.indexOf('<div class="panel play">'),end=html.indexOf('<div id="feedback"',start),body=html.slice(start,end);body=body.replace('<div class="panel play">','<div class="panel play qa-locked" inert aria-label="Готовый результат">');return html.slice(0,start)+body+`<div class="feedback good" role="status">${esc(feedback||'Задание выполнено.')}</div><div class="qa-next">${btn(S.step+1>=taskCount()?'Завершить уровень':'Далее','advanceTask()','primary')}</div>`};
const qaResume=resume;resume=function(){qaResume();if(page!=='game'||!S||S.transfer)return;let completed=(g===0&&S.missing?.length===0)||(g===1&&S.balls?.every(b=>b.dead))||(g===3&&S.goalLog?.['round-'+S.step+'-0']?.solved);if(completed&&!S.awaitNext){S.awaitNext=true;H=[];render();persist()}else if(!S.awaitNext){clearMessage();render();persist()}};
const qaUndo=undo;undo=function(){if(busy||S.awaitNext||S.transfer||!H.length)return;let ta=S.taskAttempts,th=S.taskHelp,helped=clone(S.helpedGoals||{}),seen=clone(S.seen||[]),inter=S.intermediateShots||0;qaUndo();S.taskAttempts=ta;S.taskHelp=th;S.helpedGoals=helped;S.seen=uniq([...S.seen||[],...seen]);S.intermediateShots=inter;hintText='';hintStage=0;clearMessage();render();persist()};
function hintBall(){let id=Number(String(S.focusGoal||'').split('-').pop());return S.balls.find(b=>b.id===id&&accessible(b))||S.balls.find(accessible)}
function hintGoal(){if(g===0)return 'wheel-'+S.selected;if(g===1)return 'cannon-'+S.step+'-'+hintBall()?.id;return 'round-'+S.step+'-'+(g===5?(S.rgbStep||0):0)}
// Successful individual targets cannot be undone; undo applies to uncommitted decisions only.
const qaTrial=trial;trial=function(ok,t,kind=''){let k=S.focusGoal||('round-'+S.step+'-'+(g===5?(S.rgbStep||0):0));S.taskHelp=!!S.helpedGoals?.[k];qaTrial(ok,t,kind);if(ok){H=[];return}let entry=S.goalLog[S.focusGoal||('round-'+S.step+'-'+(g===5?(S.rgbStep||0):0))];if(entry&&entry.attempts>=2&&hintStage<Math.min(3,entry.attempts)){hintStage=Math.min(2,entry.attempts-1);hint();} };
// Clear feedback when exploring a different candidate; no stale green message.
function wrapEdit(fn,unchanged=null){return function(...args){if(busy||page!=='game'||S.awaitNext||S.transfer||unchanged?.(...args))return;clearMessage();return fn(...args)}}
const qaPickWheel=pickWheel;pickWheel=wrapEdit(function(i){hintText='';hintStage=0;S.taskHelp=!!S.helpedGoals?.['wheel-'+i];qaPickWheel(i)},i=>S.selected===i);selectShot=wrapEdit(selectShot,i=>S.selected===i);travelPick=wrapEdit(travelPick,i=>S.choice===i);travelView=wrapEdit(travelView,i=>S.view===i&&S.seen?.includes(i));paintPick=wrapEdit(paintPick);paintSlot=wrapEdit(paintSlot,i=>S.slot===i);clearPaint=wrapEdit(clearPaint,()=>!S.paints.length);shadowPick=wrapEdit(shadowPick,i=>S.shadowChoice===i);rgbToggle=wrapEdit(rgbToggle);packSet=wrapEdit(packSet,(k,i)=>S.design[k]===i);toggleLamp=wrapEdit(toggleLamp);
const qaMoveLamp=moveLamp;moveLamp=function(i,v){if(busy||S.awaitNext||S.transfer||LIGHT[l][S.step].type==='observe')return;clearMessage();qaMoveLamp(i,v)};
const qaBindLights=bindLights;bindLights=function(){if(LIGHT[l][S.step].type!=='observe')qaBindLights()};
// Preserve final sample for RGB second task but no stale previous success text.
const qaCheckRGB=checkRGB;checkRGB=function(){let n=S.rgbStep;qaCheckRGB();if(S.rgbStep!==n&&!S.awaitNext){H=[];hintText='';hintStage=0;clearMessage();render();persist()}};
const qaRender=render;render=function(){qaRender();if(page==='game'&&S.awaitNext){if(g===5&&['light','observe'].includes(S.phase))drawLight();document.querySelectorAll('.qa-locked button[onclick^="check"],.qa-locked button[onclick="confirmTravel()"],.qa-locked button[onclick^="contextAnswer"]').forEach(n=>n.remove());document.querySelectorAll('.qa-locked button,.qa-locked input,.qa-locked textarea').forEach(n=>n.disabled=true);document.querySelectorAll('.qa-locked [tabindex]').forEach(n=>n.tabIndex=-1);return}if(page==='game'&&S.transfer){let a=document.querySelector('.footer');if(a)a.innerHTML='';}if(page==='game'&&g===5&&!S.transfer&&S.phase==='shadow'&&hintStage>=2){let opt=document.querySelectorAll('.choicegrid button')[1];if(opt)opt.classList.add('qa-suggest')}if(page==='game'&&g===3&&!S.transfer&&hintStage>=3&&TRAVEL[l][S.step].type==='pick'){document.querySelectorAll('.travel-sample')[TRAVEL[l][S.step].ok]?.classList.add('qa-suggest')}if(page==='game'&&g===0&&!S.transfer&&hintStage>=3&&S.selected!=null){let el=document.querySelector(`[onclick="placeWheel(${S.selected})"] circle`);if(el){el.setAttribute('stroke','#ffdf87');el.setAttribute('stroke-width','6')}}};
// Bind rendering to current phase: never draw lighting / aim on a completion screen.
// Guard against double taps during animations and against invisible legacy controls.
document.addEventListener('click',e=>{if(page==='game'&&(busy||(S?.awaitNext&&!e.target.closest('[onclick="advanceTask()"], [onclick="go(\'home\')"]')))){e.preventDefault();e.stopImmediatePropagation()}},true);

// Layout only: do not change task state, input handlers or storage.
function fitPlay(){
 if(page!=='game')return;
 const a=$('app');const w=window.innerWidth,h=window.visualViewport?.height||window.innerHeight;
 const phone=w<=700;
 const min=phone?205:180;
 let limit=Math.max(min,Math.min(phone?315:475,h-(phone?300:210)));
 let small=Math.max(phone?105:100,Math.min(phone?155:260,h*(phone?.20:.34)));
 const apply=()=>{a.style.setProperty('--scene-limit',limit+'px');a.style.setProperty('--scene-small',small+'px')};
 apply();
 // Shrink only scene artwork, never buttons, text, or interactive forms.
 for(let k=0;k<4;k++){
   const overflow=Math.ceil(a.getBoundingClientRect().bottom+window.scrollY-h);
   if(overflow<=1)break;
   const old=limit+small;
   limit=Math.max(min,limit-overflow);small=Math.max(phone?90:85,small-Math.ceil(overflow/2));apply();
   if(old===limit+small)break;
 }
}
const compactRender=render;render=function(){document.body.dataset.game=String(g);compactRender();fitPlay()};
const compactMsg=msg;msg=function(...args){compactMsg(...args);fitPlay()};
